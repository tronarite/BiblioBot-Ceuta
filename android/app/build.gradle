plugins {
    id 'com.android.application'
}

android {
    namespace 'net.tronarite.bibliobot'
    compileSdk 35

    defaultConfig {
        applicationId 'net.tronarite.bibliobot'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // URL a la que apunta la app
        buildConfigField 'String', 'APP_URL', '"https://bibliobot.tronarite.net/"'
        buildConfigField 'String', 'APP_HOST', '"bibliobot.tronarite.net"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
}
