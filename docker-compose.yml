services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/data/bibliobot.db
    volumes:
      - backend_data:/data
    # Sin "ports": la API solo es accesible a través del nginx del frontend (red interna de
    # Docker), nunca directamente desde fuera saltándose el proxy.
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  backend_data:
