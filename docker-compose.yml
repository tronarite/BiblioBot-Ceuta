services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/data/bibliobot.db
    volumes:
      - backend_data:/data
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  backend_data:
